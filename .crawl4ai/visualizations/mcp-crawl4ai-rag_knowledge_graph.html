ource": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:52492", "target": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:52493", "type": "has_method"}, {"source": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:419", "target": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:52494", "type": "defines"}, {"source": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:419", "target": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:767", "type": "defines"}, {"source": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:419", "target": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:685", "type": "defines"}, {"source": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:419", "target": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:550", "type": "defines"}, {"source": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:419", "target": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:468", "type": "defines"}, {"source": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:419", "target": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:453", "type": "defines"}, {"source": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:419", "target": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:422", "type": "defines"}, {"source": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:335", "target": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:341", "type": "contains"}, {"source": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:341", "target": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:353", "type": "defines"}, {"source": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:353", "target": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:389", "type": "has_method"}, {"source": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:341", "target": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:398", "type": "defines"}, {"source": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:353", "target": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:383", "type": "has_method"}, {"source": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:353", "target": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:373", "type": "has_method"}, {"source": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:353", "target": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:370", "type": "has_method"}]
        };
        
        const width = 1160;
        const height = 600;
        
        const color = d3.scaleOrdinal(d3.schemeCategory10);
        
        const svg = d3.select("#graph")
            .append("svg")
            .attr("width", width)
            .attr("height", height);
        
        const tooltip = d3.select(".tooltip");
        
        const simulation = d3.forceSimulation(data.nodes)
            .force("link", d3.forceLink(data.links).id(d => d.id).distance(100))
            .force("charge", d3.forceManyBody().strength(-300))
            .force("center", d3.forceCenter(width / 2, height / 2))
            .force("collision", d3.forceCollide().radius(30));
        
        const link = svg.append("g")
            .selectAll("line")
            .data(data.links)
            .join("line")
            .attr("stroke", "#999")
            .attr("stroke-opacity", 0.6)
            .attr("stroke-width", 2);
        
        const node = svg.append("g")
            .selectAll("circle")
            .data(data.nodes)
            .join("circle")
            .attr("r", d => d.type === 'repository' ? 12 : d.type === 'file' ? 8 : 6)
            .attr("fill", d => color(d.group))
            .attr("stroke", "#fff")
            .attr("stroke-width", 2);
        
        const label = svg.append("g")
            .selectAll("text")
            .data(data.nodes)
            .join("text")
            .text(d => d.name)
            .attr("font-size", "10px")
            .attr("dx", 15)
            .attr("dy", 4);
        
        node.on("mouseover", function(event, d) {
            tooltip.transition().duration(200).style("opacity", .9);
            tooltip.html(`
                <strong>${d.type.toUpperCase()}</strong><br/>
                Name: ${d.name}<br/>
                ${d.path ? `Path: ${d.path}<br/>` : ''}
                ID: ${d.id}
            `)
            .style("left", (event.pageX + 10) + "px")
            .style("top", (event.pageY - 28) + "px");
        })
        .on("mouseout", function(d) {
            tooltip.transition().duration(500).style("opacity", 0);
        });
        
        node.call(d3.drag()
            .on("start", dragstarted)
            .on("drag", dragged)
            .on("end", dragended));
        
        simulation.on("tick", () => {
            link
                .attr("x1", d => d.source.x)
                .attr("y1", d => d.source.y)
                .attr("x2", d => d.target.x)
                .attr("y2", d => d.target.y);
                
            node
                .attr("cx", d => d.x)
                .attr("cy", d => d.y);
                
            label
                .attr("x", d => d.x)
                .attr("y", d => d.y);
        });
        
        function dragstarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }
        
        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }
        
        function dragended(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }
    </script>
