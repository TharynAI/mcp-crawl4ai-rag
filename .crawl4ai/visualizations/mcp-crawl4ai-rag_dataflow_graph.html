a7a-4d66-befb-45cc0e910a8f:225", "type": "imports", "arrow": true, "dashed": true}, {"source": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:77", "target": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:664", "type": "imports", "arrow": true, "dashed": true}, {"source": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:77", "target": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:54", "type": "imports", "arrow": true, "dashed": true}, {"source": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:77", "target": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:532", "type": "imports", "arrow": true, "dashed": true}, {"source": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:77", "target": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:328", "type": "imports", "arrow": true, "dashed": true}, {"source": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:77", "target": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:57", "type": "imports", "arrow": true, "dashed": true}, {"source": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:77", "target": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:719", "type": "imports", "arrow": true, "dashed": true}, {"source": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:77", "target": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:226", "type": "imports", "arrow": true, "dashed": true}, {"source": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:77", "target": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:193", "type": "imports", "arrow": true, "dashed": true}, {"source": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:77", "target": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:218", "type": "imports", "arrow": true, "dashed": true}, {"source": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:77", "target": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:602", "type": "imports", "arrow": true, "dashed": true}, {"source": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:77", "target": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:106", "type": "imports", "arrow": true, "dashed": true}, {"source": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:77", "target": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:219", "type": "imports", "arrow": true, "dashed": true}, {"source": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:77", "target": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:839", "type": "imports", "arrow": true, "dashed": true}, {"source": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:77", "target": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:891", "type": "imports", "arrow": true, "dashed": true}, {"source": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:77", "target": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:272", "type": "imports", "arrow": true, "dashed": true}, {"source": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:77", "target": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:678", "type": "imports", "arrow": true, "dashed": true}, {"source": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:77", "target": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:585", "type": "imports", "arrow": true, "dashed": true}, {"source": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:77", "target": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:406", "type": "imports", "arrow": true, "dashed": true}, {"source": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:77", "target": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:575", "type": "imports", "arrow": true, "dashed": true}, {"source": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:77", "target": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:96", "type": "imports", "arrow": true, "dashed": true}, {"source": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:233", "target": "4:62a7fd5c-2a7a-4d66-befb-45cc0e910a8f:241", "type": "contains", "arrow": true}]
        };
        
        const svg = d3.select("#graph");
        const container = document.getElementById("graph");
        const width = container.clientWidth;
        const height = container.clientHeight;
        
        svg.attr("width", width).attr("height", height);
        
        // Color scheme for dark theme
        const colors = {
            file: "#58a6ff",
            class: "#a371f7",
            method: "#8cc85f",
            import: "#f97583",
            function: "#ffa657"
        };
        
        const tooltip = d3.select(".tooltip");
        
        // Create arrow markers
        svg.append("defs").selectAll("marker")
            .data(["arrow", "arrow-dashed"])
            .join("marker")
            .attr("id", d => d)
            .attr("viewBox", "0 -5 10 10")
            .attr("refX", 20)
            .attr("refY", 0)
            .attr("markerWidth", 8)
            .attr("markerHeight", 8)
            .attr("orient", "auto")
            .append("path")
            .attr("d", "M0,-5L10,0L0,5")
            .attr("fill", "#8b949e");
        
        // Create simulation with directional force
        const simulation = d3.forceSimulation(data.nodes)
            .force("link", d3.forceLink(data.links).id(d => d.id).distance(80))
            .force("charge", d3.forceManyBody().strength(-400))
            .force("x", d3.forceX(d => width * (0.2 + d.level * 0.3)).strength(0.3))
            .force("y", d3.forceY(height / 2).strength(0.1))
            .force("collision", d3.forceCollide().radius(25));
        
        // Create container groups
        const g = svg.append("g");
        
        // Create links with arrows
        const link = g.append("g")
            .selectAll("line")
            .data(data.links)
            .join("line")
            .attr("stroke", d => d.dashed ? "#30363d" : "#484f58")
            .attr("stroke-opacity", 0.8)
            .attr("stroke-width", d => d.type === 'imports' ? 1 : 2)
            .attr("stroke-dasharray", d => d.dashed ? "5,5" : null)
            .attr("marker-end", d => d.arrow ? (d.dashed ? "url(#arrow-dashed)" : "url(#arrow)") : null);
        
        // Create nodes
        const node = g.append("g")
            .selectAll("g")
            .data(data.nodes)
            .join("g")
            .call(d3.drag()
                .on("start", dragstarted)
                .on("drag", dragged)
                .on("end", dragended));
        
        // Add circles for nodes
        node.append("circle")
            .attr("r", d => d.type === 'file' ? 8 : d.type === 'class' ? 7 : 5)
            .attr("fill", d => colors[d.type] || "#8b949e")
            .attr("stroke", "#0d1117")
            .attr("stroke-width", 2);
        
        // Add labels
        node.append("text")
            .text(d => d.label)
            .attr("x", 12)
            .attr("y", 4)
            .style("font-size", "10px")
            .style("fill", "#c9d1d9");
        
        // Tooltip interactions
        node.on("mouseover", function(event, d) {
            tooltip.transition().duration(200).style("opacity", .95);
            tooltip.html(`
                <strong>${d.type.toUpperCase()}</strong><br/>
                ${d.label}<br/>
                Level: ${d.level}
            `)
            .style("left", (event.pageX + 10) + "px")
            .style("top", (event.pageY - 28) + "px");
        })
        .on("mouseout", function(d) {
            tooltip.transition().duration(500).style("opacity", 0);
        });
        
        // Zoom functionality
        const zoom = d3.zoom()
            .scaleExtent([0.5, 3])
            .on("zoom", (event) => {
                g.attr("transform", event.transform);
            });
        
        svg.call(zoom);
        
        // Simulation tick
        simulation.on("tick", () => {
            link
                .attr("x1", d => d.source.x)
                .attr("y1", d => d.source.y)
                .attr("x2", d => d.target.x)
                .attr("y2", d => d.target.y);
            
            node.attr("transform", d => `translate(${d.x},${d.y})`);
        });
        
        function dragstarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }
        
        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }
        
        function dragended(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }
    </script>
</body>
